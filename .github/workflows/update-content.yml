name: Update Foodican Content

on:
  schedule:
    # Run every 6 hours
    - cron: '17 */6 * * *'

  # Allow you to manually run it from GitHub
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: foodican-content-update
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest

    timeout-minutes: 5

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Verify YouTube feed
        env:
          YOUTUBE_CHANNEL_ID: 'UCE6VXOmQeNKBqVspyX5qoWA'
        run: |
          node - <<'NODE'
          const https = require('https');

          const channelId =
            process.env.YOUTUBE_CHANNEL_ID;

          const url =
            `https://www.youtube.com/feeds/videos.xml?channel_id=${channelId}`;

          console.log(`Testing: ${url}`);

          https.get(
            url,
            {
              headers: {
                'User-Agent': 'Foodican GitHub Action/1.0'
              }
            },
            response => {
              let body = '';

              response.on(
                'data',
                chunk => {
                  body += chunk;
                }
              );

              response.on(
                'end',
                () => {
                  console.log(
                    `HTTP status: ${response.statusCode}`
                  );

                  console.log(
                    `Response length: ${body.length}`
                  );

                  if (
                    response.statusCode !== 200
                  ) {
                    process.exit(1);
                  }

                  if (
                    !body.includes('<entry>')
                  ) {
                    console.error(
                      'YouTube feed did not contain any entries.'
                    );

                    process.exit(1);
                  }

                  const matches =
                    body.match(
                      /<yt:videoId>/g
                    ) || [];

                  console.log(
                    `Videos detected: ${matches.length}`
                  );
                }
              );
            }
          ).on(
            'error',
            error => {
              console.error(
                error.message
              );

              process.exit(1);
            }
          );
          NODE

      - name: Update Foodican content
        env:
          YOUTUBE_CHANNEL_ID: 'UCE6VXOmQeNKBqVspyX5qoWA'
          YOUTUBE_HANDLE: '@thefoodican'
          MAX_ITEMS: '100'
        run: |
          node scripts/update-content.js

      - name: Validate generated content
        run: |
          node - <<'NODE'
          const fs = require('fs');

          const file =
            'data/content.json';

          if (!fs.existsSync(file)) {
            throw new Error(
              'data/content.json was not generated.'
            );
          }

          const data =
            JSON.parse(
              fs.readFileSync(
                file,
                'utf8'
              )
            );

          if (
            !Array.isArray(data.items)
          ) {
            throw new Error(
              'content.json items is not an array.'
            );
          }

          if (
            data.items.length === 0
          ) {
            throw new Error(
              'content.json contains zero items.'
            );
          }

          for (
            const item of data.items
          ) {
            if (
              !item.id ||
              !item.title ||
              !item.url
            ) {
              throw new Error(
                `Invalid item: ${JSON.stringify(item)}`
              );
            }
          }

          console.log(
            `Validated ${data.items.length} content items.`
          );
          NODE

      - name: Show content summary
        run: |
          node - <<'NODE'
          const fs = require('fs');

          const data =
            JSON.parse(
              fs.readFileSync(
                'data/content.json',
                'utf8'
              )
            );

          console.log('');
          console.log('Foodican content:');
          console.log('');

          data.items
            .slice(0, 15)
            .forEach(
              (item, index) => {
                console.log(
                  `${index + 1}. ${item.title}`
                );

                console.log(
                  `   ${item.isShort ? 'SHORT' : 'VIDEO'}`
                );

                console.log(
                  `   ${item.url}`
                );

                console.log('');
              }
            );
          NODE

      - name: Commit changes only when needed
        run: |
          git config user.name 'Foodican Bot'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'

          git add data/content.json

          if git diff --cached --quiet; then
            echo "No content changes detected."
            exit 0
          fi

          git commit \
            -m "chore: update Foodican content"

          git push