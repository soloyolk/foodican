name: Update Foodican Content

on:
  schedule:
    # Run every 4 hours.
    - cron: '17 */4 * * *'

  # Allow manual runs from GitHub Actions.
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: foodican-content-update
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest

    timeout-minutes: 20

    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:

      # ============================================================
      # CHECKOUT
      # ============================================================

      - name: Checkout
        uses: actions/checkout@v5
        with:
          fetch-depth: 1


      # ============================================================
      # NODE
      # ============================================================

      - name: Set up Node
        uses: actions/setup-node@v5
        with:
          node-version: '24'


      # ============================================================
      # UPDATE CONTENT
      #
      # update-content.js tries the free YouTube feed first,
      # retries transient failures, then falls back to the
      # YouTube Data API when necessary.
      # ============================================================

      - name: Update Foodican content
        env:
          YOUTUBE_CHANNEL_ID: 'UCE6VXOmQeNKBqVspyX5qoWA'
          YOUTUBE_HANDLE: '@thefoodican'
          YOUTUBE_API_KEY: ${{ secrets.YOUTUBE_API_KEY }}
          MAX_ITEMS: '100'

          # One-time full-history import. The script creates
          # data/.youtube-history-imported after a successful
          # import, so future runs automatically skip the scan.
          YOUTUBE_FULL_HISTORY: 'true'
        run: |
          node scripts/update-content.js


      # ============================================================
      # VALIDATE GENERATED CONTENT
      # ============================================================

      - name: Validate generated content
        run: |
          node - <<'NODE'
          const fs = require('fs');

          const file =
            'data/content.json';

          if (
            !fs.existsSync(file)
          ) {
            throw new Error(
              'data/content.json was not generated.'
            );
          }

          const raw =
            fs.readFileSync(
              file,
              'utf8'
            );

          const data =
            JSON.parse(raw);

          if (
            !Array.isArray(
              data.items
            )
          ) {
            throw new Error(
              'content.json items is not an array.'
            );
          }

          if (
            data.items.length === 0
          ) {
            throw new Error(
              'content.json contains zero items.'
            );
          }

          for (
            const item
            of data.items
          ) {
            if (
              !item.id ||
              !item.title ||
              !item.url
            ) {
              throw new Error(
                `Invalid item: ${JSON.stringify(item)}`
              );
            }

            const hasLatitude =
              typeof item.latitude === 'number';

            const hasLongitude =
              typeof item.longitude === 'number';

            /*
             * Coordinates must either both exist or both be null.
             */
            if (
              hasLatitude !==
              hasLongitude
            ) {
              throw new Error(
                `Latitude/longitude mismatch for ${item.id}`
              );
            }

            if (
              hasLatitude &&
              (
                item.latitude < -90 ||
                item.latitude > 90
              )
            ) {
              throw new Error(
                `Invalid latitude for ${item.id}: ${item.latitude}`
              );
            }

            if (
              hasLongitude &&
              (
                item.longitude < -180 ||
                item.longitude > 180
              )
            ) {
              throw new Error(
                `Invalid longitude for ${item.id}: ${item.longitude}`
              );
            }
          }

          console.log(
            `Validated ${data.items.length} content items.`
          );
          NODE


      # ============================================================
      # SHOW SUMMARY
      # ============================================================

      - name: Show content summary
        run: |
          node - <<'NODE'
          const fs = require('fs');

          const data =
            JSON.parse(
              fs.readFileSync(
                'data/content.json',
                'utf8'
              )
            );

          const mapped =
            data.items.filter(
              item =>
                typeof item.latitude === 'number' &&
                typeof item.longitude === 'number'
            );

          const youtubeMapped =
            data.items.filter(
              item =>
                item.locationSource === 'youtube'
            );

          console.log('');
          console.log(
            '========================================'
          );
          console.log(
            '       FOODICAN CONTENT SUMMARY'
          );
          console.log(
            '========================================'
          );
          console.log('');

          console.log(
            `Total videos: ${data.items.length}`
          );

          console.log(
            `Mapped videos: ${mapped.length}`
          );

          console.log(
            `YouTube-mapped videos: ${youtubeMapped.length}`
          );

          console.log(
            `Unmapped videos: ${
              data.items.length -
              mapped.length
            }`
          );

          console.log('');

          data.items
            .slice(0, 15)
            .forEach(
              (item, index) => {
                console.log(
                  `${index + 1}. ${item.title}`
                );

                console.log(
                  `   ${
                    item.isShort
                      ? 'SHORT'
                      : 'VIDEO'
                  }`
                );

                console.log(
                  `   ${
                    item.location ||
                    'No location'
                  }`
                );

                if (
                  typeof item.latitude === 'number' &&
                  typeof item.longitude === 'number'
                ) {
                  console.log(
                    `   ${
                      item.latitude
                    }, ${
                      item.longitude
                    }`
                  );
                }

                if (
                  item.locationSource
                ) {
                  console.log(
                    `   Source: ${
                      item.locationSource
                    }`
                  );
                }

                console.log('');
              }
            );
          NODE


      # ============================================================
      # DETERMINE WHETHER CONTENT CHANGED
      # ============================================================

      - name: Check for content changes
        id: changes
        run: |
          if \
            git diff --quiet -- data/content.json && \
            git diff --quiet -- data/.youtube-history-imported && \
            git ls-files --error-unmatch data/.youtube-history-imported >/dev/null 2>&1; then
            echo "changed=false" >> "$GITHUB_OUTPUT"

            echo ''
            echo 'No content changes detected.'
            echo 'Skipping commit and deployment.'
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"

            echo ''
            echo 'Content changes detected.'
            echo ''

            git diff --stat -- data/content.json data/.youtube-history-imported
          fi


      # ============================================================
      # COMMIT CONTENT
      # ============================================================

      - name: Commit content changes
        if: steps.changes.outputs.changed == 'true'
        run: |
          git config user.name \
            'Foodican Bot'

          git config user.email \
            '41898282+github-actions[bot]@users.noreply.github.com'

          git add \
            data/content.json \
            data/.youtube-history-imported

          git commit \
            -m "chore: update Foodican content"

          git push


      # ============================================================
      # CONFIGURE GITHUB PAGES
      # ============================================================

      - name: Configure Pages
        if: steps.changes.outputs.changed == 'true'
        uses: actions/configure-pages@v5


      # ============================================================
      # PACKAGE WEBSITE
      # ============================================================

      - name: Upload site
        if: steps.changes.outputs.changed == 'true'
        uses: actions/upload-pages-artifact@v3
        with:
          path: '.'


      # ============================================================
      # DEPLOY WEBSITE
      # ============================================================

      - name: Deploy Foodican
        if: steps.changes.outputs.changed == 'true'
        id: deployment
        uses: actions/deploy-pages@v4
