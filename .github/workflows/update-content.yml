```yaml
name: Update Foodican Content

on:
  schedule:
    # Run every 6 hours
    - cron: '17 */6 * * *'

  # Allow manual updates from GitHub Actions
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - name: Install latest yt-dlp
        run: |
          python -m pip install --upgrade --disable-pip-version-check yt-dlp

      - name: Verify yt-dlp
        run: |
          yt-dlp --version

      - name: Update Foodican content
        env:
          YOUTUBE_HANDLE: '@thefoodican'
          MAX_ITEMS: '100'
        run: |
          node scripts/update-content.js

      - name: Commit changes
        run: |
          git config user.name 'Foodican Bot'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'

          git add data/content.json

          git diff --cached --quiet || git commit \
            -m "chore: update Foodican content"

          git push
```
