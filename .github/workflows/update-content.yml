name: Update Foodican Content

on:
  schedule:
    - cron: '17 */6 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Install YouTube resolver
        run: python -m pip install --disable-pip-version-check yt-dlp
      - name: Update from YouTube
        env:
          YOUTUBE_HANDLE: '@thefoodican'
          MAX_ITEMS: '30'
        run: node scripts/update-content.js
      - name: Commit changes
        run: |
          git config user.name 'Foodican Bot'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add data/content.json
          git diff --cached --quiet || git commit -m "chore: update Foodican content"
          git push
